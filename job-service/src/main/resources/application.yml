spring:
  application:
    name: deal

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: job-service-group

  datasource:
    url: jdbc:postgresql://postgres:5432/ruleset_db   # хост 'postgres' — это имя сервиса в docker-compose
    username: ruleset_user                             # пользователь из docker-compose
    password: ruleset_pass                             # пароль из docker-compose
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
server:
  port: 8083