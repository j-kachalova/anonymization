version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ruleset_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  gateway:
    build:
      context: ./gateway  # Путь к каталогу с исходниками Gateway
    container_name: gateway
    ports:
      - "8080:8080"  # Порт для доступа к Gateway
    depends_on:
      - ruleset
      - job-service
      - file-processing
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GATEWAY_RULESET_URI=http://ruleset:8080  # Статический URI для Ruleset Service
      - GATEWAY_JOB_URI=http://job-service:8080        # Статический URI для Job Service
      - GATEWAY_FILE_URI=http://file-processing:8080  # Статический URI для File Processing Service

  ruleset:
    build:
      context: ./ruleset
    container_name: ruleset
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ruleset_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8082:8082"


  job-service:
    container_name: job-service
    build: job-service
    ports:
      - 8083:8083
    environment:
      KAFKA_SERVER: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ruleset_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - kafka
      - postgres

  file-processing:
    container_name: file-processing
    build: file-processing
    ports:
      - 8084:8084
    environment:
      KAFKA_SERVER: kafka:9092
    depends_on:
      - kafka


  zookeeper:
    image: confluentinc/cp-zookeeper:5.5.11.amd64
    container_name: zookeeper
    ports:
      - "2181:2181"
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:5.5.11.amd64
    container_name: kafka
    ports:
      - "9092:9092"
    restart: always
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  flink-jobmanager:
    image: flink:latest
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    depends_on:
      - kafka

  flink-taskmanager:
    image: flink:latest
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

