spring:
  application:
    name: ruleset

  datasource:
    url: jdbc:postgresql://postgres:5432/ruleset_db   # хост 'postgres' — это имя сервиса в docker-compose
    username: ruleset_user                             # пользователь из docker-compose
    password: ruleset_pass                             # пароль из docker-compose
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
server:
  port: 8082

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
