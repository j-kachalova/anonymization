server:
  port: 8084
spring:
  application:
    name: file-processing

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: file-group
  datasource:
    url: jdbc:postgresql://postgres:5432/ruleset_db   # хост 'postgres' — это имя сервиса в docker-compose
    username: postgres                             # пользователь из docker-compose
    password: postgres                             # пароль из docker-compose
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
